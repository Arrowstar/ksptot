; GM Data from https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/gm_de431.tpc
; Orbit data from Horizons, epoch @ UT = 0 is J2000
;
; ======================== REFERENCE FRAMES AND UNITS ========================
; All vectors and angles in this file use the Sun-Earth ecliptic J2000 frame
; (mean ecliptic and equinox of J2000.0; SPICE name ECLIPJ2000):
;
;   ORBITS (epoch/sma/ecc/inc/raan/arg/mean) - Geometric osculating Keplerian
;      elements at epoch JDTDB 2451545.0 (J2000.0 = 2000-Jan-01 12:00 TDB).
;      Planets are heliocentric (center = Sun); moons are planet-centered
;      (e.g. Phobos/Deimos relative to Mars center). Elements queried from the
;      JPL Horizons API (https://ssd.jpl.nasa.gov/api/horizons.api) with
;      EPHEM_TYPE=ELEMENTS, CSV output columns EC,QR,IN,OM,W,Tp,N,MA,TA,A,AD,PR.
;      sma is in km, all angular elements in degrees, gm in km^3/s^2.
;      radius is the mean body radius in km (for the gas/ice giants, the
;      published 1-bar reference level).
;
;   ROTATION (rotperiod/rotini/bodyxaxis/bodyzaxis) - bodyzaxis/bodyxaxis are
;      the IAU body-fixed frame's z/x unit vectors at J2000.0 expressed in the
;      ecliptic J2000 frame, computed with cspice_pxform('IAU_<BODY>',
;      'ECLIPJ2000', et) from NAIF's pck00011.tpc (Archinal et al. 2018).
;      rotini is the IAU prime-meridian angle W at J2000.0 in degrees;
;      rotperiod is the sidereal rotation period in seconds (negative =
;      retrograde). See each body's Rotational info comment and
;      tests/unit_tests/SolarSystemRotationPckTest.m. Exceptions: Earth keeps
;      its legacy bodyxaxis = (1,0,0); the Sun carries no axis vectors.
;
; ======================== ATMOSPHERE MODELS (methodology) ========================
; The atmosphere tables (atmoHgt, atmoPressAlts/Presses, atmoTempAlts/Temps,
; atmoMolarMass) below were built from PUBLISHED planetary atmosphere data,
; never from the KSP Real Solar System mod. Summary of the method:
;
;   1. SOURCE SELECTION - For each body with a real atmosphere, the standard
;      reference model was identified: VIRA (Venus), MCD v6.2 (Mars),
;      Voyager/Galileo radio-occultation profiles (Jupiter, Saturn, Uranus,
;      Neptune), and New Horizons REX (Pluto). Surface/1-bar pressures,
;      temperatures, and mean molecular masses cross-checked against NASA
;      planetary fact sheets.
;
;   2. MODEL CONSTRUCTION - Where the source publishes T(z) and P(z) directly
;      (Venus, Mars, Pluto T-profile), those tables were adopted verbatim.
;      Where the source publishes only T(P) anchors (the gas giants), the
;      profile was built by hydrostatic integration of the ideal-gas
;      hydrostatic equation d(lnP) = -dz/H, H = R*T/(M*g), with T(P)
;      linearly interpolated between the published anchor points. This is the
;      same procedure the published sounding teams used to convert the
;      occultation T-P pairs into geometric altitude.
;      For all bodies the altitude 0 level is the physical surface (Venus,
;      Mars, Pluto) or, for the giant planets, the published 1-bar reference
;      level, which coincides with the `radius` field.
;
;   3. GRID TABULATION - The model was resampled onto a 2 km altitude grid
;      (denser where the source table provides finer nodes). Max linear-
;      interpolation pressure error of the tabulated grid vs the continuous
;      model is <= ~2% everywhere and < 0.3% for the giants over the
;      drag-relevant range (validated with a 4000-point fine-grid check).
;
;   4. VALIDATION - Each tabulated curve was validated against the published
;      anchor values (surface T, P, density; tropopause and stratospheric
;      T/P; monotonicity of P(z); zero density above atmoHgt). Worst surface
;      anchor deviation is 3e-3 relative (Pluto density); worst altitude-
;      anchor deviation is 1.7% relative (Mars P at 21.18 km, a grid-
;      interpolation effect). Regression-checked against Earth's USSA76
;      model. See zz_gen_atmo_models.m (generator), zz_verify_atmo_models.m
;      (validation script), and tests/unit_tests/SolarSystemAtmosphereTest.m
;      (unit test) in the repository root.
;
; Pressures in this file are in kPa, temperatures in K, altitudes in km,
; molar masses in kg/mol, matching the USSA76 Earth entry.
; ==================================================================================
